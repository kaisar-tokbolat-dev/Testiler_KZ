<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/styles/styles.css">

    <style>

        /*Правильные ответы*/
        .correct-answers {
            padding: 20px;
            gap: 20px;
            display: flex;
            flex-direction: column;
            border-style: solid;
            border-width: 5px;
            border-radius: 20px;
            border-color: green;
        }

        .div-question > ul, .correct-answers > ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

            .div-question > ul > li, .correct-answers > ul > li {
                display: flex;
                flex-direction: row;
                align-items: center;
                padding: 10px;
                border-radius: 20px;
                gap: 10px;
            }

            .correct-answers > ul > li {
                padding: 0;
                border-radius: 0;
            }

        /*Список вопросов*/
        #question-list {
            display: flex;
            row-gap: 40px;
            flex-direction: column;
            align-items: center;
        }

        /*Контейнер вопроса*/
        .div-question {
            border-color: purple;
            border-radius: 20px;
            border-width: 5px;
            border-style: dashed;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 70%;
        }

            .div-question label {
                font-size: 20pt;
            }

        /*Основной контент*/
        #main {
            display: flex;
            flex-direction: column;
            gap: 60px;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
        }

        /*Информационная панель*/
        .test-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-color: purple;
            border-radius: 20px;
            border-style: solid;
            border-width: 5px;
            padding: 40px;
        }

            .test-info label {
                font-size: 20pt;
            }

        .div-ai-answer {
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-color: purple;
            border-width: 5px;
            border-style: solid;
            border-radius: 20px;
            padding: 40px;
        }

            .div-ai-answer label:not(.title) {
                text-align: justify;
            }
    </style>

</head>
<body>

    <!--Основной контент-->
    <div id="main"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="/js/main.js"></script>

    <script>
        // Основной контент
        async function setContent() {
            // Получить язык
            const lang = await getSelectedLanguage();

            // Получить имя пользователя
            const username = await getUsername();

            // Основной контент
            const main_content = document.getElementById("main");

            // Получить идентификатор истории теста
            const testHistoryId = getTestHistoryId();

            // Загрузка истории теста
            await getTestHistory();

            // Загрузка истории теста
            async function getTestHistory() {
                try {
                    // Запрос
                    const response = await fetch(`/api/test-history?testHistoryId=${testHistoryId}`);

                    // Отобразить историю теста
                    if (response.ok) {
                        const result = await response.json();
                        const testHistory = result.testHistory;
                        console.log(testHistory);

                        // Отобразить историю теста
                        document.startViewTransition(() => showTestHistory(testHistory));
                    }
                    else {
                        const message = await response.text();
                        throw new Error(message);
                    }
                }
                catch (error) {
                    showMessageBox(data[lang]?.[error.message] ?? error.message, "error");
                }
            }

            // Отобразить историю теста
            function showTestHistory(testHistory) {
                // Заголовок теста
                const label_test_title = document.createElement("label");
                label_test_title.textContent = testHistory.title.toUpperCase();
                label_test_title.className = "title";
                main_content.appendChild(label_test_title);

                // ИНФОРМАЦИОННАЯ ПАНЕЛЬ
                const div_test_info = document.createElement("div");
                div_test_info.className = "test-info";
                main_content.appendChild(div_test_info);
                // 1. Дата прохождения
                const label_taked_time = document.createElement("label");
                label_taked_time.textContent = `${data[lang]?.takedDateTime ?? ""}: ${getDate(testHistory.takedDateTime)}`;
                div_test_info.appendChild(label_taked_time);
                // 2. Баллы
                const label_score = document.createElement("label");
                label_score.textContent = `${data[lang]?.userScore ?? ""}: ${testHistory.score} / ${testHistory.maxScore}`;
                div_test_info.appendChild(label_score);
                // 3. Результат теста в процентах
                const label_test_results = document.createElement("label");
                label_test_results.textContent = `${data[lang]?.testResult ?? ""}: ${getTestResults(testHistory)}%`;
                div_test_info.appendChild(label_test_results);
                // 4. Количество вопросов
                const label_question_count = document.createElement("label");
                label_question_count.textContent = `${data[lang]?.questionCount ?? ""}: ${testHistory.questions.length}`;
                div_test_info.appendChild(label_question_count);

                // Список вопросов
                const div_question_list = document.createElement("div");
                div_question_list.id = "question-list";
                main_content.appendChild(div_question_list);

                // Вопросы теста
                const questions = testHistory.questions;

                console.log(questions);

                // Перебор вопросов
                questions.forEach((x, id) => {
                    // Контейнер вопроса
                    const div_question = document.createElement("div");
                    div_question.id = x.questionId;
                    div_question.className = "div-question";
                    div_question_list.appendChild(div_question);

                    // Текст вопроса
                    const label_question = document.createElement("label");
                    label_question.textContent = `${id + 1}. ${x.text}`;
                    div_question.appendChild(label_question);

                    // Список ответов
                    const ul_answers = document.createElement("ul");
                    div_question.appendChild(ul_answers);

                    // Ответы вопроса
                    const answers = x.answers;

                    // Отображение ответов
                    answers.forEach(y => {
                        // 1. Элемент списка ответов
                        const li_answer = document.createElement("li");
                        ul_answers.appendChild(li_answer);

                        // 2. Элемент выбора
                        const selection_control_answer = document.createElement("input");;
                        selection_control_answer.name = x.questionId;
                        selection_control_answer.id = y.answerId;
                        selection_control_answer.style.pointerEvents = "none";
                        li_answer.appendChild(selection_control_answer);

                        // Радиокнопка
                        if (x.type === 0) {
                            selection_control_answer.type = "radio";
                        }

                        // Чекбокс
                        else if (x.type === 1) {
                            selection_control_answer.type = "checkbox";
                        }

                        // 3. Текст ответа
                        const label_answer = document.createElement("label");
                        label_answer.textContent = y.text;
                        label_answer.htmlFor = y.id;
                        li_answer.appendChild(label_answer);

                        // 4. Иконка
                        const icon_answer = document.createElement("div");
                        icon_answer.style = "align-items: center; margin-left: auto;";
                        li_answer.appendChild(icon_answer);

                        // Ответ, который выбрал пользователь
                        if (x.userAnswers.includes(y.answerId)) {
                            selection_control_answer.checked = true;

                            if (x.correctAnswers.includes(y.answerId)) {
                                li_answer.style = "background: green;";
                                icon_answer.className = "animation fa-regular fa-circle-check fa-bounce fa-2x";
                            }
                            else {
                                li_answer.style = "background: red;";
                                icon_answer.className = "animation fa-solid fa-circle-xmark fa-bounce fa-2x";
                            }
                        }
                    });

                    // Выбрал ли пользователь правильный ответ
                    const areArraysEqual = (a, b) =>
                        a.length === b.length &&
                        a.every((val, index) => val === b[index]);

                    if (areArraysEqual(x.correctAnswers, x.userAnswers) == false) {
                        // Контейнер правильных ответов
                        const div_correct_answers = document.createElement("div");
                        div_correct_answers.className = "correct-answers";
                        div_question.appendChild(div_correct_answers);

                        // Заголовок
                        const label_title_correct_answers = document.createElement("label");
                        if (x.correctAnswers.length > 1) {
                            label_title_correct_answers.textContent = data[lang]?.correctAnswers + ":" ?? "";
                        }
                        else {
                            label_title_correct_answers.textContent = data[lang]?.correctAnswer + ":" ?? "";
                        }
                        label_title_correct_answers.className = "title";
                        div_correct_answers.appendChild(label_title_correct_answers);

                        // Список правильных ответов
                        const ul_correct_answers = document.createElement("ul");
                        div_correct_answers.appendChild(ul_correct_answers);

                        x.correctAnswers.forEach(correctAnswerId => {
                            // 1. Элемент списка правильных ответов
                            const li_correct_answer = document.createElement("li");
                            ul_correct_answers.appendChild(li_correct_answer);

                            // 2. Элемент выбора
                            const selection_control_correct_answer = document.createElement("input");;
                            selection_control_correct_answer.style = "pointer-events: none; accent-color: green;";
                            selection_control_correct_answer.checked = true;
                            li_correct_answer.appendChild(selection_control_correct_answer);

                            // Радиокнопка
                            if (x.type === 0) {
                                selection_control_correct_answer.type = "radio";
                            }

                            // Чекбокс
                            else if (x.type === 1) {
                                selection_control_correct_answer.type = "checkbox";
                            }

                            // 3. Текст правильного ответа
                            const label_correct_answer = document.createElement("label");
                            label_correct_answer.textContent = x.answers.find(a => a.answerId === correctAnswerId).text;
                            li_correct_answer.appendChild(label_correct_answer);
                        });

                        // Показать ответ ИИ
                        var div_ai_answer = null;
                        if (x.aiAnswer) {
                            // 4. Ответ ИИ
                            div_ai_answer = showAiAnswer(x.aiAnswer);
                            div_question.appendChild(div_ai_answer);
                        }
                        // 5. Кнопка "Спросить у ИИ"
                        const button_ask_ai = document.createElement("button");
                        button_ask_ai.textContent = data[lang]?.askAi ?? "";
                        button_ask_ai.addEventListener("click", async () => {
                            // Контроллер
                            const controller = new AbortController();
                            const signal = controller.signal;

                            // Модальное окно при загрузке результатов ИИ
                            const dialog_loader_modal = document.createElement("dialog");
                            dialog_loader_modal.innerHTML = `
                             <!--Основной контент-->
                             <div class="content">
                             <!--Текст-->
                             <label id="loader-modal-text">${data[lang]?.aiLoading ?? ""}</label>

                             <!--Спиннер-->
                             <div class="loader"></div>

                             <!--Кнопка "Отмена"-->
                             <button id="button-cancel">${data[lang]?.cancel ?? ""}</button>
                             </div>
     `
                            main_content.appendChild(dialog_loader_modal);

                            // Назначение кнопок
                            dialog_loader_modal.addEventListener("click", async (event) => {
                                // Кнопка "Отмена"
                                if (event.target && event.target.id === "button-cancel") {
                                    controller.abort();
                                    document.startViewTransition(() => dialog_loader_modal.close());
                                }
                            });

                            // Преобразованный вопрос
                            const parsedQuestion = {
                                // Заголовок теста
                                testTitle: testHistory.title,

                                // Текст вопроса
                                questionText: x.text,

                                // Неправильные ответы пользователя
                                wrongUserAnswers: x.answers.filter(a => a.isCorrect == false && x.userAnswers.includes(a.answerId)).map(a => a.text),

                                // Все правильные ответы вопроса
                                correctAnswers: x.answers.filter(a => a.isCorrect == true).map(a => a.text)
                            };

                            try {
                                // Данные для отправки
                                const formData = new FormData();
                                formData.append("questionHistoryId", x.id);
                                formData.append("questionForAskJson", JSON.stringify(parsedQuestion));

                                // Показать модальное окно
                                document.startViewTransition(() => dialog_loader_modal.showModal());

                                // Запрос
                                const response = await fetch(`/api/ask-ai?testHistoryId=${testHistory.id}`, {
                                    method: "POST",
                                    body: formData,
                                    signal: signal
                                });

                                // Закрыть модальное окно
                                document.startViewTransition(() => dialog_loader_modal.close());

                                // Запрос успешно выполнен
                                if (response.ok) {
                                    // Результат запроса
                                    const result = await response.json();

                                    console.log(result);

                                    // Отобразить текстовое поле
                                    document.startViewTransition(() => {

                                        if (div_ai_answer) {
                                            div_ai_answer.replaceWith(showAiAnswer(result));
                                        }
                                        else {
                                            div_question.appendChild(showAiAnswer(result));
                                        }
                                    });
                                }

                                // Сообщение об ошибке
                                else {
                                    const message = await response.text();
                                    throw new Error(message);
                                }
                            }
                            catch (error) {
                                showMessageBox(data[lang]?.[error.message] ?? error.message, "error");
                            }
                            finally {
                                // Закрыть модальное окно
                                document.startViewTransition(() => dialog_loader_modal.close());
                            }
                        });
                        div_question.appendChild(button_ask_ai);
                    }

                    // 6. Баллы за каждый вопрос
                    const div_scores = document.createElement("div");
                    div_scores.style = "display: flex; flex-direction: row; gap: 10px; border-color: purple; border-width: 5px; border-style: dashed; border-radius: 20px; padding: 20px;";
                    div_question.appendChild(div_scores);
                    // Текст
                    const label_scores = document.createElement("label");
                    label_scores.style = "margin-left: auto";
                    label_scores.textContent = showQuestionScore(lang, x.score, x.correctAnswers.length);
                    div_scores.appendChild(label_scores);
                });

                // 7. КНОПКИ
                const div_buttons = document.createElement("div");
                div_buttons.className = "buttons";
                main_content.appendChild(div_buttons);
                // 1. Открыть тест
                const button_open_test = document.createElement("button");
                button_open_test.textContent = data[lang]?.open.toUpperCase() ?? "";
                button_open_test.addEventListener("click", () => {
                    window.location.href = `/info?testId=${testHistory.testId}`;
                });
                div_buttons.appendChild(button_open_test);
                // 1.1. Иконка кнопки "Открыть"
                const icon_open_test = document.createElement("div");
                icon_open_test.className = "fa-solid fa-book-open";
                button_open_test.appendChild(icon_open_test);

                // 2. Кнопка для перехода на главный экран
                const button_main_page = document.createElement("button");
                button_main_page.textContent = data[lang]?.mainPage.toUpperCase() ?? "";
                button_main_page.addEventListener("click", () => {
                    window.location.href = "home/main";
                });
                div_buttons.appendChild(button_main_page);
                // 2.1. Ионка кнопки "Домой"
                const icon_main_page = document.createElement("div");
                icon_main_page.className = "fa-solid fa-house-chimney";
                button_main_page.appendChild(icon_main_page);

                // Показать ответ ИИ
                function showAiAnswer(aiAnswer) {
                    // КОНТЕЙНЕР ОТВЕТА ИИ
                    const div_ai_answer = document.createElement("div");
                    div_ai_answer.className = "div-ai-answer";

                    // 1. Заголовок
                    const title_ai_answer = document.createElement("label");
                    title_ai_answer.textContent = data[lang]?.aiAnswer.toUpperCase() ?? "";
                    title_ai_answer.className = "title";
                    div_ai_answer.appendChild(title_ai_answer);

                    // 2. Текстовое поле ответа ИИ
                    const label_ai_answer = document.createElement("label");
                    label_ai_answer.innerHTML = marked.parse(aiAnswer);
                    div_ai_answer.appendChild(label_ai_answer);

                    return div_ai_answer;
                }
            }
        }

        // Основной контент
        setContent();
    </script>
</body>
</html>
